name: Build dsh image

on:
  schedule:
    # 00:00 UTC, every day.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'deepseek-harness git ref (branch, tag or commit SHA)'
        required: false
        default: master
        type: string
      push_image:
        description: 'Push the image to GHCR (uncheck for a build-only test run)'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/**'

concurrency:
  group: build-dsh-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPOSITORY: deepseek-ai/deepseek-harness
  UPSTREAM_URL: https://github.com/deepseek-ai/deepseek-harness.git

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build is disk-hungry: drop the preinstalled toolchains first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Resolve upstream ref
        id: upstream
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-master}"
          sha="$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${UPSTREAM_REPOSITORY}/commits/${ref}" | jq -r '.sha')"
          echo "ref=${ref}"         >> "$GITHUB_OUTPUT"
          echo "sha=${sha}"         >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}"   >> "$GITHUB_OUTPUT"
          echo "Building ${UPSTREAM_REPOSITORY}@${ref} (${sha})"

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=raw,value=sha-${{ steps.upstream.outputs.short }}
          labels: |
            org.opencontainers.image.title=deepseek-harness
            org.opencontainers.image.description=DeepSeek Harness, built from source
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPOSITORY }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
            org.opencontainers.image.version=${{ steps.upstream.outputs.ref }}

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Test on the Actions runner before updating any published tags.
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_REPOSITORY=${{ env.UPSTREAM_URL }}
            DSH_REF=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify the built image actually boots, so entrypoint / tsx-resolution /
      # native-binding regressions surface here instead of on your machine.
      # Uses `--network host` because dsh refuses to bind a non-loopback host.
      - name: Smoke test (boot + HTTP)
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}:latest"

          # The native loader swallows the real dlopen/ABI error into a nested
          # `attempts` array, and Node's default inspect collapses it — so print
          # the environment, the shipped binary, its dynamic deps and the FULL
          # error verbatim. Best-effort: never fail the step on this alone.
          echo "::group::native binding diagnostics"
          docker run --rm --entrypoint sh "$image" -c '
            echo "== process.versions =="; node -p "process.versions"
            pkg="$(find /app/node_modules/.pnpm -maxdepth 1 -type d -name "node-addon-require-builtin-linux-x64-gnu@*" 2>/dev/null | head -n1)"
            echo "== platform package: ${pkg} =="
            root="${pkg}/node_modules/node-addon-require-builtin-linux-x64-gnu"
            echo "== installed addon version =="; grep -m1 "\"version\"" "${root}/package.json" 2>&1 || true
            echo "== prebuilds.json =="; cat "${root}/prebuilds.json" 2>&1 || true
            echo "== prebuilt dir =="; ls -l "${root}/prebuilt" 2>&1 || true
            echo "== ldd =="; for f in "${root}"/prebuilt/*.node; do echo "-- $f"; ldd "$f" 2>&1 || true; done
            echo "== require from vendor/loader (full error) =="
            node -e "const u=require(\"node:util\");const r=require(\"node:module\").createRequire(\"/app/vendor/loader/package.json\");try{console.log(\"resolved:\",r.resolve(\"node-addon-require-builtin\"));const addon=r(\"node-addon-require-builtin\");console.log(addon.getBindingInfo())}catch(e){console.error(u.inspect(e,{depth:null,maxArrayLength:null,maxStringLength:null,colors:false}));process.exitCode=1}"
          ' || true
          echo "::endgroup::"

          echo "::group::dsh web --help"
          docker run --rm "$image" web --help
          echo "::endgroup::"

          # Match the deployed read-only filesystem and restricted permissions.
          for layout in normal hardened nas-bridge; do
            echo "::group::boot layout: ${layout}"
            tmp_flags=()
            network_flags=(--network host)
            app_args=()
            if [ "$layout" != "normal" ]; then
              tmp_flags=(--read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1g
                --security-opt no-new-privileges:true --cap-drop ALL)
            fi
            if [ "$layout" = "nas-bridge" ]; then
              network_flags=(-p 127.0.0.1:3080:3080)
              app_args=(web --no-open --patch /app/docker-web.patch.yml
                --trusted-host 127.0.0.1:3080)
            fi
            docker run -d --name dsh-smoke "${network_flags[@]}" "${tmp_flags[@]}" \
              -e DSH_HOME=/tmp/dsh-home "$image" "${app_args[@]}"
            cleanup() {
              echo "::group::container logs"
              docker logs dsh-smoke 2>&1 || true
              echo "::endgroup::"
              docker rm -f dsh-smoke >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            # The documented readiness signal is the `dsh web:` URL line.
            ready=""
            for i in $(seq 1 60); do
              if docker logs dsh-smoke 2>&1 | grep -q 'dsh web:'; then
                ready=1; echo "readiness line after ~$((i * 5))s"; break
              fi
              running="$(docker inspect -f '{{.State.Running}}' dsh-smoke 2>/dev/null || echo false)"
              if [ "$running" != "true" ]; then
                echo "container exited before becoming ready"; break
              fi
              sleep 5
            done
            [ -n "$ready" ] || { echo "::error::web server never reported readiness"; exit 1; }

            # Prove the listener is reachable. Any HTTP status counts; the startup
            # URL carries a token, so 401/403 still means the port is open.
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/ || true)"
            echo "GET http://127.0.0.1:3080/ -> ${code}"
            [ "$code" != "000" ] || { echo "::error::nothing listening on 3080"; exit 1; }
            cleanup
            trap - EXIT
            echo "::endgroup::"
          done

      - name: Publish verified image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_REPOSITORY=${{ env.UPSTREAM_URL }}
            DSH_REF=${{ steps.upstream.outputs.sha }}
          # Reuse the candidate build in this same Buildx builder.
          cache-from: type=gha

      # Retention: drop everything older than a week so the registry does not
      # grow without bound. Only runs when an image was actually pushed, so
      # build-only manual test runs leave Packages untouched.
      #
      # Note the action's semantics: `older-than` scopes *every* rule to images
      # older than the interval. So this is "delete all tags of images older
      # than 7 days" (NOT "keep the newest N older images"). `latest` is
      # excluded so a usable image always survives.
      - name: Prune image versions older than a week
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: ${{ github.event.repository.name }}
          older-than: 7 days
          delete-tags: '*'
          exclude-tags: latest
          # Also sweep leftover untagged manifests (platform/attestation blobs)
          # and referrers whose parent image is already gone.
          delete-untagged: true
          delete-orphaned-images: true
